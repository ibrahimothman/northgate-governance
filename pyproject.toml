[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "northgate-governance-hub"
version = "0.1.0"
description = "Governed enterprise-architecture registries for a synthetic healthcare organisation"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["governance_registry*"]